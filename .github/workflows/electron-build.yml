name: Build Electron EXE

on:
  push:
    branches:
      - main
    paths:
      - 'NudgeMeElectron/**'

jobs:
  build-win:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: NudgeMeElectron

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: NudgeMeElectron/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Electron App
        run: npm run package -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-exe
          path: NudgeMeElectron/dist/*.exe
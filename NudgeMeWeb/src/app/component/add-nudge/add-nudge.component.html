<mat-card class="add-nudge-card">
    <mat-card-header>
        <mat-card-title>Add Nudge</mat-card-title>
        <mat-card-subtitle>Schedule a new reminder</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <form (ngSubmit)="submit()" [formGroup]="form" class="nudge-form" novalidate>
            <mat-form-field appearance="outline" class="full">
                <mat-label>Info</mat-label>
                <textarea matInput rows="3" formControlName="info" placeholder="What should we remind you?"></textarea>
                <mat-hint align="end">{{ info.value.length }}/500</mat-hint>
                <mat-error *ngIf="info.hasError('required')">Info is required</mat-error>
                <mat-error *ngIf="info.hasError('maxlength')">Max 500 characters</mat-error>
            </mat-form-field>

            <div class="date-time-row">
                <mat-form-field appearance="outline" class="flex-field">
                    <mat-label>Date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="date">
                    <mat-hint>MM/DD/YYYY</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="picker" [disabled]="submitting()">
                        <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
                    </mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                    <mat-error *ngIf="form.controls.date.hasError('required')">Date is required</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="flex-field">
                    <mat-label>Time</mat-label>
                    <input matInput [matTimepicker]="hoursPicker" formControlName="time">
                    <mat-timepicker-toggle matIconSuffix [for]="hoursPicker" [disabled]="submitting()" />
                    <mat-timepicker interval="0.5h" #hoursPicker />
                    <mat-error *ngIf="form.controls.time.hasError('required')">Time is required</mat-error>
                </mat-form-field>
            </div>

            <div class="actions">
                <button mat-flat-button color="primary" type="submit" [disabled]="submitting() || form.invalid">
                    @if (!submitting()) {
                        <span class="btn-content"><mat-icon>add</mat-icon> Create Nudge</span>
                    } @else {
                        <span class="saving-wrapper">
                            <mat-spinner diameter="20"></mat-spinner>
                            Creating...
                        </span>
                    }
                </button>
            </div>
        </form>

        @if (createdId(); as id) {
            <div class="success-message">
                <mat-icon>check_circle</mat-icon>
                <span>Reminder #{{ id }} created successfully!</span>
            </div>
        }

        @if (error(); as e) {
            <div class="error-message">
                <mat-icon>error</mat-icon>
                <span>{{ e }}</span>
            </div>
        }
    </mat-card-content>
</mat-card>
